steps:
  # 1. Build the container image (API_URL is injected at runtime via Cloud Run env vars)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/mata-repo/mata-frontend:$COMMIT_SHA', '-f', 'clients/web_frontend/Dockerfile', 'clients/web_frontend/']

  # 3. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/mata-repo/mata-frontend:$COMMIT_SHA']

  # 4. Deploy identical image to the existing Terraform-managed Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mata-frontend'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/mata-repo/mata-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'

options:
  logging: CLOUD_LOGGING_ONLY
